<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>计算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: #1c1c1c;
            border-radius: 22px;
            padding: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.45);
        }
        #display {
            width: 100%;
            height: 96px;
            font-size: 2.4rem;
            text-align: right;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: #2a2a2a;
            color: #fff;
            cursor: pointer;
            overflow-x: auto;
            margin-bottom: 14px;
        }
        .advanced-area {
            display: none;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }
        .normal-area {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 9px;
        }
        button {
            height: 62px;
            font-size: 1.15rem;
            border: none;
            border-radius: 14px;
            color: white;
            cursor: pointer;
            transition: 0.12s ease;
        }
        button:active {
            transform: scale(0.94);
        }
        .num {
            background: #333;
        }
        .op {
            background: #ff9f0a;
        }
        .func {
            background: #444654;
        }
        .clear {
            background: #a5a5a5;
            color: #000;
        }
        .equal {
            background: #ff9f0a;
        }
        .zero {
            grid-column: span 2;
            text-align: left;
            padding-left: 24px;
        }
        .mode-tip {
            text-align: center;
            color: #aaa;
            font-size: 0.82rem;
            margin-bottom: 10px;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="mode-tip" id="modeTip">普通模式</div>
        <input id="display" readonly value="0">

        <div class="advanced-area" id="advancedPanel">
            <button class="func" onclick="insertFn('sin(')">sin</button>
            <button class="func" onclick="insertFn('cos(')">cos</button>
            <button class="func" onclick="insertFn('tan(')">tan</button>
            <button class="func" onclick="insertFn('log(')">log</button>
            <button class="func" onclick="insertFn('ln(')">ln</button>

            <button class="func" onclick="appendChar('Math.PI')">π</button>
            <button class="func" onclick="appendChar('Math.E')">e</button>
            <button class="func" onclick="insertFn('sqrt(')">√</button>
            <button class="func" onclick="appendChar('^')">xʸ</button>
            <button class="func" onclick="insertFn('fact(')">n!</button>
        </div>

        <div class="normal-area">
            <button class="clear" onclick="clearAll()">AC</button>
            <button class="clear" onclick="toggleSign()">+/-</button>
            <button class="clear" onclick="appendChar('%')">%</button>
            <button class="op" onclick="appendChar('/')">÷</button>

            <button class="num" onclick="appendChar('7')">7</button>
            <button class="num" onclick="appendChar('8')">8</button>
            <button class="num" onclick="appendChar('9')">9</button>
            <button class="op" onclick="appendChar('*')">×</button>

            <button class="num" onclick="appendChar('4')">4</button>
            <button class="num" onclick="appendChar('5')">5</button>
            <button class="num" onclick="appendChar('6')">6</button>
            <button class="op" onclick="appendChar('-')">−</button>

            <button class="num" onclick="appendChar('1')">1</button>
            <button class="num" onclick="appendChar('2')">2</button>
            <button class="num" onclick="appendChar('3')">3</button>
            <button class="op" onclick="appendChar('+')">+</button>

            <button class="num zero" onclick="appendChar('0')">0</button>
            <button class="num" onclick="appendChar('.')">.</button>
            <button class="equal" onclick="calcResult()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        const advancedPanel = document.getElementById('advancedPanel');
        const modeTip = document.getElementById('modeTip');

        let clickCount = 0;
        let clickTimer = null;
        let advancedMode = false;

        // 点击显示屏五次切换高级模式
        display.addEventListener('click', () => {
            clickCount++;
            clearTimeout(clickTimer);
            clickTimer = setTimeout(() => {
                clickCount = 0;
            }, 700);

            if (clickCount >= 5) {
                clickCount = 0;
                toggleAdvanced();
            }
        });

        function toggleAdvanced() {
            advancedMode = !advancedMode;
            if (advancedMode) {
                advancedPanel.style.display = 'grid';
                modeTip.textContent = '高级科学模式';
            } else {
                advancedPanel.style.display = 'none';
                modeTip.textContent = '普通模式';
            }
        }

        function appendChar(ch) {
            if (display.value === '0' && !['.', '-'].includes(ch)) {
                display.value = ch;
            } else {
                display.value += ch;
            }
        }

        function insertFn(fnStr) {
            if (display.value === '0') display.value = '';
            display.value += fnStr;
        }

        function clearAll() {
            display.value = '0';
        }

        function toggleSign() {
            let v = parseFloat(display.value);
            display.value = String(-v);
        }

        function fact(n) {
            if (!Number.isInteger(n) || n < 0) return NaN;
            if (n === 0 || n === 1) return 1;
            let r = 1;
            for (let i = 2; i <= n; i++) r *= i;
            return r;
        }

        function calcResult() {
            try {
                let expr = display.value
                    .replace(/×/g, '*')
                    .replace(/÷/g, '/')
                    .replace(/\^/g, '**')
                    .replace(/sqrt\(/g, 'Math.sqrt(')
                    .replace(/sin\(/g, 'Math.sin(')
                    .replace(/cos\(/g, 'Math.cos(')
                    .replace(/tan\(/g, 'Math.tan(')
                    .replace(/ln\(/g, 'Math.log(')
                    .replace(/log\(/g, 'Math.log10(')
                    .replace(/fact\(/g, 'fact(');

                let res = eval(expr);
                if (!isFinite(res)) throw new Error();
                display.value = Number.isInteger(res) ? res : Number(res.toPrecision(12));
            } catch {
                display.value = '错误';
                setTimeout(() => display.value = '0', 1200);
            }
        }
    </script>
</body>
</html>
